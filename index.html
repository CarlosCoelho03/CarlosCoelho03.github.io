<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficheiros das Equipas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.18);
      --text: #f0f0f0;
      --muted: #888;
      --accent: #4f8ef7;
      --accent-dim: rgba(79,142,247,0.12);
      --success: #22c97a;
      --success-dim: rgba(34,201,122,0.1);
      --error: #f25c5c;
      --radius: 14px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .header .logo {
      width: 48px;
      height: 48px;
      background: var(--accent-dim);
      border: 1px solid rgba(79,142,247,0.25);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 1rem;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: .375rem;
    }
    .header p {
      font-size: 14px;
      color: var(--muted);
    }

    /* ── Steps ── */
    .steps {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      margin-bottom: 1.75rem;
    }
    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border-hover);
      transition: all .3s;
    }
    .dot.active {
      width: 20px;
      border-radius: 3px;
      background: var(--accent);
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: .75rem;
    }

    /* ── Team grid ── */
    .team-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 1rem;
    }
    .team-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .875rem;
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, background .15s;
      color: var(--text);
    }
    .team-btn:hover { border-color: var(--border-hover); }
    .team-btn.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .team-btn .icon { font-size: 22px; margin-bottom: .5rem; display: block; }
    .team-btn .name { font-size: 13px; font-weight: 500; }
    .team-btn .label { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ── Primary button ── */
    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: .75rem;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      letter-spacing: .01em;
    }
    .btn-primary:hover { opacity: .88; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: .35; cursor: not-allowed; }

    /* ── Back button ── */
    .btn-back {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 1.25rem;
      padding: 0;
      transition: color .15s;
    }
    .btn-back:hover { color: var(--text); }

    /* ── Team badge ── */
    .team-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(79,142,247,0.2);
      border-radius: 20px;
      padding: 3px 10px;
      margin-bottom: .875rem;
    }

    /* ── Code input ── */
    .card h2 { font-size: 15px; font-weight: 600; margin-bottom: .25rem; }
    .card .hint { font-size: 13px; color: var(--muted); margin-bottom: 1rem; }

    .code-row {
      display: flex;
      gap: 8px;
    }
    .code-row input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 20px;
      letter-spacing: .2em;
      text-transform: uppercase;
      text-align: center;
      padding: .625rem .5rem;
      outline: none;
      transition: border-color .15s;
    }
    .code-row input:focus { border-color: var(--accent); }
    .code-row input.shake {
      animation: shake .35s ease;
      border-color: var(--error);
    }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-6px)}
      40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)}
      80%{transform:translateX(4px)}
    }

    .code-row button {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      padding: 0 1rem;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      white-space: nowrap;
    }
    .code-row button:hover { border-color: var(--border-hover); background: var(--border); }

    .error-msg {
      font-size: 12px;
      color: var(--error);
      margin-top: .5rem;
    }

    /* ── Success box ── */
    .success-box {
      background: var(--success-dim);
      border: 1px solid rgba(34,201,122,0.2);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-top: 1rem;
    }
    .success-box p { font-size: 13px; color: var(--success); margin-bottom: .75rem; }
    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--success);
      color: #0a1f14;
      border: none;
      border-radius: var(--radius-sm);
      padding: .75rem;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: opacity .15s;
    }
    .btn-download:hover { opacity: .88; }

    /* ── Admin panel ── */
    .admin-toggle {
      text-align: center;
      margin-top: 2rem;
      color: var(--border-hover);
      font-size: 18px;
      cursor: pointer;
      letter-spacing: 4px;
      transition: color .15s;
      user-select: none;
    }
    .admin-toggle:hover { color: var(--muted); }
    .admin-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-top: .75rem;
    }
    .admin-panel h3 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .admin-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: .625rem;
      font-size: 13px;
    }
    .admin-row .team-name { flex: 1; color: var(--text); }
    .code-pill {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 8px;
      color: var(--accent);
      letter-spacing: .1em;
    }
    .admin-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: .875rem;
      padding-top: .875rem;
      border-top: 1px solid var(--border);
    }

    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap');
  </style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>

<script>
// ══════════════════════════════════════════════
//  CONFIGURAÇÃO — edita aqui os teus dados
// ══════════════════════════════════════════════
const TEAMS = [
  { id: 1, name: "Equipa Camara Municipal", emoji: "🔴", code: "ALFA7", file: "pdfs/camara_municipal.pdf" },
  { id: 2, name: "Equipa 2", emoji: "🔵", code: "BETA3", file: "pdfs/jovens.pdf" },
  { id: 3, name: "Equipa 3", emoji: "🟢", code: "GAMA9", file: "pdfs/investidores.pdf" },
  { id: 4, name: "Equipa 4", emoji: "🟡", code: "DELT2", file: "pdfs/proprietarios_AL.pdf" },
  { id: 5, name: "Equipa 5", emoji: "🟣", code: "EPSL6", file: "pdfs/grupo_hoteleiro.pdf" },
];
// ══════════════════════════════════════════════

let state = { screen: "pick", selected: null, codeVal: "", error: "", unlocked: false, adminOpen: false };

function render() {
  document.getElementById("app").innerHTML =
    state.screen === "pick" ? renderPick() : renderCode();
  attach();
}

function renderPick() {
  return `
    <div class="header">
      <div class="logo">📁</div>
      <h1>Ficheiros das Equipas</h1>
      <p>Escolhe a tua equipa e insere o código secreto</p>
    </div>
    <div class="steps">
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>
    <div class="card">
      <div class="team-grid">
        ${TEAMS.map(t => `
          <button class="team-btn${state.selected === t.id ? " selected" : ""}" data-id="${t.id}">
            <span class="icon">${t.emoji}</span>
            <span class="name">${t.name}</span>
            <span class="label">PDF disponível</span>
          </button>
        `).join("")}
      </div>
      <button class="btn-primary" id="continueBtn" ${!state.selected ? "disabled" : ""}>
        Continuar →
      </button>
    </div>
    <div class="admin-toggle" id="adminToggle">· · ·</div>
    ${state.adminOpen ? renderAdmin() : ""}
  `;
}

function renderAdmin() {
  return `
    <div class="admin-panel">
      <h3>Painel do organizador</h3>
      ${TEAMS.map(t => `
        <div class="admin-row">
          <span>${t.emoji}</span>
          <span class="team-name">${t.name}</span>
          <span class="code-pill">${t.code}</span>
        </div>
      `).join("")}
      <p class="admin-note">
        Partilha cada código apenas com a equipa respetiva.<br>
        Os PDFs devem estar em: <code style="color:var(--accent)">pdfs/equipaN.pdf</code>
      </p>
    </div>
  `;
}

function renderCode() {
  const t = TEAMS.find(x => x.id === state.selected);
  return `
    <div class="header">
      <div class="logo">🔑</div>
      <h1>Código de acesso</h1>
      <p>Insere o código para desbloquear o teu ficheiro</p>
    </div>
    <div class="steps">
      <div class="dot"></div>
      <div class="dot active"></div>
    </div>
    <button class="btn-back" id="backBtn">← Voltar</button>
    <div class="card">
      <div class="team-badge">${t.emoji} ${t.name}</div>
      <h2>Código secreto</h2>
      <p class="hint">Introduz o código de 5 letras fornecido pelo organizador.</p>
      <div class="code-row">
        <input id="codeInput" maxlength="5" placeholder="·····" autocomplete="off"
          value="${state.codeVal}" spellcheck="false" />
        <button id="checkBtn">Verificar</button>
      </div>
      ${state.error ? `<p class="error-msg">${state.error}</p>` : ""}
      ${state.unlocked ? `
        <div class="success-box">
          <p>✓ Código correto! O teu ficheiro está pronto.</p>
          <a class="btn-download" href="${t.file}" download="${t.file.split('/').pop()}">
            ⬇ Descarregar ${t.name} PDF
          </a>
        </div>
      ` : ""}
    </div>
  `;
}

function attach() {
  document.querySelectorAll(".team-btn").forEach(btn => {
    btn.onclick = () => { state.selected = parseInt(btn.dataset.id); render(); };
  });

  const cont = document.getElementById("continueBtn");
  if (cont) cont.onclick = () => {
    if (state.selected) { state.screen = "code"; state.error = ""; state.unlocked = false; render(); }
  };

  const back = document.getElementById("backBtn");
  if (back) back.onclick = () => { state.screen = "pick"; render(); };

  const adm = document.getElementById("adminToggle");
  if (adm) adm.onclick = () => { state.adminOpen = !state.adminOpen; render(); };

  const inp = document.getElementById("codeInput");
  if (inp) {
    inp.focus();
    inp.oninput = () => { state.codeVal = inp.value.toUpperCase(); inp.value = state.codeVal; };
    inp.onkeydown = e => { if (e.key === "Enter") check(); };
  }

  const chk = document.getElementById("checkBtn");
  if (chk) chk.onclick = check;
}

function check() {
  const t = TEAMS.find(x => x.id === state.selected);
  const val = (document.getElementById("codeInput")?.value || "").toUpperCase().trim();
  state.codeVal = val;
  if (val === t.code) {
    state.unlocked = true;
    state.error = "";
  } else {
    state.unlocked = false;
    state.error = "Código incorreto. Tenta novamente.";
    const inp = document.getElementById("codeInput");
    if (inp) { inp.classList.add("shake"); setTimeout(() => inp.classList.remove("shake"), 400); }
  }
  render();
}

render();
</script>
</body>
</html>
